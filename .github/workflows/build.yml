name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o KathmanduValleyOfflineMaps.zip -d extracted

      - name: Fix Java/Kotlin JVM target mismatch
        run: |
          cat > extracted/KathmanduValleyOfflineMaps/app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

          android {
              namespace 'com.example.kathmanduoffline'
              compileSdk 35
              defaultConfig { applicationId 'com.example.kathmanduoffline'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'org.maplibre.gl:android-sdk:11.7.0'
              implementation 'com.google.android.gms:play-services-location:21.3.0'
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: extracted/KathmanduValleyOfflineMaps
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KathmanduValleyOfflineMaps-debug-apk
          path: extracted/KathmanduValleyOfflineMaps/app/build/outputs/apk/debug/*.apk
